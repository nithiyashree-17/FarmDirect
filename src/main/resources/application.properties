# ─── FarmDirect Application Configuration ───

# Server
server.port=${PORT:8080}

# Database (defaults to local file-based H2; set SPRING_DATASOURCE_* for PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/farmdirect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Vaadin
vaadin.launch-browser=${VAADIN_LAUNCH_BROWSER:false}
vaadin.whitelisted-packages=com.farmdirect

# Logging
logging.level.org.atmosphere=warn
logging.level.com.farmdirect=info

# App info
app.name=FarmDirect
app.version=1.0.0
