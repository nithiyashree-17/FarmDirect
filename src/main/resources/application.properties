# ─── FarmDirect Application Configuration ───

# Server
server.port=8080

# H2 Database — FILE MODE (data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/farmdirect
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Vaadin
vaadin.launch-browser=true
vaadin.whitelisted-packages=com.farmdirect

# Logging
logging.level.org.atmosphere=warn
logging.level.com.farmdirect=info

# App info
app.name=FarmDirect
app.version=1.0.0
